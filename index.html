<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <!-- 設定文字編碼，避免中文顯示亂碼 -->
  <meta charset="UTF-8">

  <!-- 讓網頁能適應手機與不同螢幕尺寸 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- 設定瀏覽器分頁標題 -->
  <title>我的個人網站</title>
</head>

<body>
  <!-- header：網頁的頁首區域 -->
  <header>
    <!-- h1：網頁最主要的標題 -->
    <h1>我的個人網站</h1>

    <!-- nav：放置網頁導覽連結 -->
    <nav>
      <!-- 連結到目前的首頁 -->
      <a href="index.html">首頁</a>

      <!-- 連結到同一個資料夾中的 about.html -->
      <a href="about.html">關於我</a>

      <!-- 連結到外部網站 -->
      <!-- target="_blank" 代表在新分頁開啟 -->
      <a
        href="https://www.tku.edu.tw/"
        target="_blank"
        rel="noreferrer"
      >
        淡江大學
      </a>
    </nav>
  </header>

  <!-- main：網頁的主要內容 -->
  <main>

    <!-- section：自我介紹區域 -->
    <section>
      <h2>自我介紹</h2>

      <!-- 插入圖片 -->
      <!-- src：圖片檔案的位置 -->
      <!-- alt：圖片無法顯示時的替代文字 -->
      <!-- width：設定圖片寬度 -->
      <img
        src="images/profile.jpg"
        alt="我的個人照片"
        width="200"
      >

      <!-- p：建立段落 -->
      <p>
        大家好，我是淡江大學的學生，
        目前正在學習網路程式設計。
      </p>

      <!-- strong：表示重要或需要強調的文字 -->
      <!-- em：表示語氣上的強調文字 -->
      <p>
        我喜歡學習
        <strong>網頁設計</strong>
        與
        <em>程式開發</em>。
      </p>
    </section>

    <!-- section：興趣清單區域 -->
    <section>
      <h2>我的興趣</h2>

      <!-- ul：建立無序清單 -->
      <ul>
        <!-- li：清單中的一個項目 -->
        <li>打遊戲</li>
        <li>聽音樂</li>
      </ul>
    </section>

    <!-- section：學習步驟區域 -->
    <section>
      <h2>我的寵物們</h2>

      <!-- ol：建立有順序的清單 -->
      <ol>
        <li>喜拿</li>
        <img
        src="images/cena.jpg"
        alt="喜拿"
        width="200"
      >
        <li>摸摸</li>
        <img
        src="images/momo.jpg"
        alt="摸摸"
        width="200"
      >
      </ol>
      <p>
        以上皆已去鼠星當小天使QQ
      </p>
    </section>

    <table>
  <caption>每週固定行程</caption>
  <thead>
    <tr>
      <th scope="col">日期</th>
      <th scope="col">主題</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td>星期一</td>
      <td>打開電腦來一場緊張刺激的特戰英豪</td>
    </tr>
    <tr>
      <td>星期三</td>
      <td>打開電腦來一場緊張刺激的英雄聯盟</td>
    </tr>
    <tr>
      <td>星期五</td>
      <td>打開電腦來一場緊張刺激的APEX</td>
    </tr>
  </tbody>
</table>

   
    <!-- div：一般區塊容器，本身沒有特殊語意 -->
    <div>
      <h2>更多資訊</h2>

      <!-- 插入連結到 about.html -->
      <p>
        <a href="about.html">查看完整自我介紹</a>
      </p>
    </div>
  </main>

  <!-- footer：網頁的頁尾區域 -->
  <footer>
    <p>© 2026 我的個人網站</p>
  </footer>
</body>

</html>
